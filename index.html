<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Task Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Task Tracker V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEEE8;--surface:#FBFBF7;--surface-2:#F2F3EE;--ink:#1A2930;--ink-2:#4A5A62;--ink-3:#6F7F87;--line:#D9DDD5;--line-2:#C4CAC1;
  --brand:#155E68;--brand-2:#0F464E;--brand-soft:#D9E8E6;--on-brand:#FFFFFF;
  --st-work:#2D6BD6;--st-pause:#BD8410;--st-done:#2B8556;--st-plan:#8A959B;
  --ok:#2B8556;--risk:#D29A14;--crit:#CB3A31;--none:#B4BBBF;
  --side:#14252C;--side-2:#1C3038;--side-ink:#DCE6E7;--side-mute:#8DA3A8;
  --shadow:0 12px 32px rgba(20,37,44,.16);
  --fu:'Onest','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --fs:'Literata','Georgia','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F;--surface:#15232A;--surface-2:#1B2B33;--ink:#E6EEEF;--ink-2:#B2C1C5;--ink-3:#8A9CA2;--line:#26383F;--line-2:#34494F;
    --brand:#5FB8BF;--brand-2:#8AD0D6;--brand-soft:#173840;--on-brand:#0B1A1E;
    --st-work:#6C9CFF;--st-pause:#E0A93A;--st-done:#4FBF85;--st-plan:#8A9AA1;
    --ok:#4FBF85;--risk:#E5B04A;--crit:#EF6A60;--none:#5A6C73;
    --side:#0B1418;--side-2:#13232A;--shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F;--surface:#15232A;--surface-2:#1B2B33;--ink:#E6EEEF;--ink-2:#B2C1C5;--ink-3:#8A9CA2;--line:#26383F;--line-2:#34494F;
  --brand:#5FB8BF;--brand-2:#8AD0D6;--brand-soft:#173840;--on-brand:#0B1A1E;
  --st-work:#6C9CFF;--st-pause:#E0A93A;--st-done:#4FBF85;--st-plan:#8A9AA1;
  --ok:#4FBF85;--risk:#E5B04A;--crit:#EF6A60;--none:#5A6C73;
  --side:#0B1418;--side-2:#13232A;--shadow:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--fu);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{flex:none}
.grow{flex:1}
.muted{color:var(--ink-3)}
#app{height:100%}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}

/* status colours: any element with .s-* / .day-* / .risk-* exposes --c */
.s-work{--c:var(--st-work)}.s-pause{--c:var(--st-pause)}.s-done{--c:var(--st-done)}.s-plan{--c:var(--st-plan)}
.day-ok,.risk-ok{--c:var(--ok)}.day-risk,.risk-risk{--c:var(--risk)}.day-crit,.risk-crit{--c:var(--crit)}.day-none,.risk-none{--c:var(--none)}
.sdot,.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--c,var(--none))}
.dot.big{width:14px;height:14px}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--crit)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;border:0;border-radius:5px;background:transparent;color:var(--ink-2);cursor:pointer}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);min-height:34px}
textarea{resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-b{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line-2);border-radius:15px;background:var(--surface);cursor:pointer;font-size:13px}
.seg-b:hover{border-color:var(--ink-3)}
.seg-b.on{border-color:var(--c,var(--brand));box-shadow:inset 0 0 0 1px var(--c,var(--brand));font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line-2);font-size:13px;font-weight:500;background:var(--surface)}

mark{background:#F4D35E;color:#1A2930;border-radius:2px;padding:0 1px}
.nav-row{display:flex;align-items:center}
.nav-row .nav{flex:1;min-width:0}
.nav-dots{flex:none;width:26px;height:30px;border:0;border-radius:5px;background:transparent;color:var(--side-mute);cursor:pointer;font-size:18px;line-height:1;opacity:0}
.nav-row:hover .nav-dots,.nav-dots:focus-visible{opacity:1}
.nav-dots:hover{background:rgba(255,255,255,.1);color:var(--side-ink)}
@media (hover:none){.nav-dots{opacity:1}}
.gs{position:relative;margin:0 4px 6px}
.gs input{background:var(--side-2);border-color:rgba(255,255,255,.14);color:var(--side-ink);min-height:32px;padding:5px 30px 5px 10px;font-size:13px}
.gs input::placeholder{color:var(--side-mute)}
.gs-res{margin:4px 4px 8px;max-height:46vh;overflow:auto;background:var(--side-2);border-radius:6px}
.gs-h{padding:8px 10px 2px;font-size:11.5px;font-weight:600;color:var(--side-mute);text-transform:uppercase;letter-spacing:.04em}
.gs-i{display:block;padding:6px 10px;font-size:13px;color:var(--side-ink);overflow-wrap:anywhere}
.gs-i:hover{background:rgba(255,255,255,.08)}
.gs-i small{display:block;color:var(--side-mute);font-size:12px}
.gs-m{padding:10px;font-size:13px;color:var(--side-mute)}
.dsearch{display:flex;gap:6px;margin-bottom:10px}
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voice audio{height:34px;max-width:100%}
.pstatus+.pstatus{margin-left:0}
button.pstatus{font:inherit;color:inherit;cursor:pointer}
.pm-item.danger{color:var(--crit)}
/* sidebar */
.side{display:flex;flex-direction:column;background:var(--side);color:var(--side-ink);padding:18px 12px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:2px 8px 18px}
.brand-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(90deg,var(--st-work) 0 33%,var(--st-pause) 33% 66%,var(--st-done) 66%);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--side);box-shadow:0 5px 0 var(--side)}
.nav{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 10px;border:0;border-radius:5px;background:transparent;color:var(--side-ink);text-align:left;cursor:pointer;font-size:14px}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:var(--side-2);box-shadow:inset 2px 0 0 #7CCBC5}
.nav.sub{padding-left:14px;font-size:13.5px}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.add{color:var(--side-mute)}
.nav-group{margin:16px 10px 4px;font-size:12.5px;color:var(--side-mute);font-weight:600}
.side-foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;display:flex;align-items:center;gap:8px}
.side-foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--side-mute)}
.side-foot button{background:none;border:0;color:var(--side-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}

/* pages */
.main{min-width:0;min-height:0;overflow:auto}
.main.is-project{display:flex;flex-direction:column;overflow:hidden}
.page{padding:28px 36px 140px;max-width:1360px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font:600 28px/1.15 var(--fs);letter-spacing:-.01em}
.page-h .sub{color:var(--ink-3);margin-top:4px}
.sec-h{display:flex;align-items:center;gap:12px;margin:34px 0 10px}
.sec-h h2{font:600 19px/1.2 var(--fs)}
.sec-h .hint{color:var(--ink-3);font-size:13px}
.ledger{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.ledger>div{padding:14px 18px;border-right:1px solid var(--line)}
.ledger>div:last-child{border-right:0}
.ledger .n{font:600 30px/1.1 var(--fs);letter-spacing:-.02em}
.ledger .l{display:flex;align-items:center;gap:7px;margin-top:5px;color:var(--ink-2);font-size:13px}
table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.tbl th{padding:10px 14px;text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line-2);vertical-align:bottom}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr.go{cursor:pointer}
.tbl tbody tr.go:hover td{background:var(--surface-2)}
.tbl .pname{font-weight:600}
.riskbtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer}
.riskbtn:hover{background:var(--surface-2)}
.risk-h small{display:block;font-weight:400;color:var(--ink-3)}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.period select,.period input{width:auto;min-height:32px}
.events{list-style:none;margin:0;padding:0;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.events li{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.events li:last-child{border-bottom:0}
.events li:hover{background:var(--surface-2)}
.events .when{flex:none;width:112px;color:var(--ink-3);font-size:13px}
.empty{padding:36px 24px;border:1px dashed var(--line-2);border-radius:6px;text-align:center;color:var(--ink-2)}
.empty h3{font:600 18px var(--fs);margin-bottom:6px;color:var(--ink)}
.empty .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* project header */
.phead{flex:none;background:var(--surface);border-bottom:1px solid var(--line-2);padding:16px 24px 0}
.phead-top{display:flex;align-items:flex-start;gap:16px}
.ptitle{font:600 24px/1.2 var(--fs);letter-spacing:-.01em}
.pmeta{color:var(--ink-3);font-size:13px;margin-top:3px;display:flex;gap:18px;flex-wrap:wrap}
.pstatus{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line-2);border-radius:6px;font-size:13px;background:var(--bg)}
.pstatus b{font-weight:600}
.pstats{display:flex;gap:0;margin:12px 0 0;flex-wrap:wrap;border-top:1px solid var(--line)}
.pstats>div{padding:8px 20px 8px 0;margin-right:20px;display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink-2)}
.pstats b{font:600 18px var(--fs);color:var(--ink)}
.plast{display:block;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;max-width:100%}
.plast b{color:var(--ink);font-weight:600}
.ptabs{display:flex;gap:4px;margin-top:2px}
.tab{padding:9px 16px 10px;border-bottom:3px solid transparent;font-weight:600;color:var(--ink-2)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tools{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line)}
.tools select{width:auto;min-height:30px;padding:3px 8px;font-size:13px}
.tools input[type=text]{width:190px;min-height:30px;padding:3px 10px;font-size:13px}
.chips{display:flex;gap:4px}
.chip{height:28px;padding:0 11px;border:1px solid transparent;border-radius:14px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.tools .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.tools .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin:0;font-weight:400;cursor:pointer}
#area{flex:1;min-height:0;position:relative}

/* board */
.board{height:100%;overflow:auto;display:flex;align-items:stretch;padding:0 12px 24px}
.col{flex:0 0 272px;display:flex;flex-direction:column;min-height:100%;border-right:1px solid var(--line);padding:0 10px 200px}
.col.is-weekend{background:rgba(0,0,0,.025)}
.col.drop-on{background:var(--brand-soft);outline:2px dashed var(--brand);outline-offset:-3px}
.col-h{position:sticky;top:0;z-index:2;margin:0 -10px 10px;padding:12px 12px 10px;background:var(--bg);border-bottom:1px solid var(--line-2);cursor:pointer}
.col.is-today .col-h{background:var(--brand-soft)}
.col-h:hover .col-num{color:var(--brand)}
.col-date{display:flex;align-items:baseline;gap:8px}
.col-num{font:600 36px/1 var(--fs);letter-spacing:-.03em}
.col.is-weekend .col-num{color:var(--ink-3)}
.col-mon{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.col-wd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:2px}
.today-tag{font-size:12px;font-weight:600;color:var(--brand);background:var(--surface);border-radius:3px;padding:0 6px}
.col-stats{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px;font-size:12px;color:var(--ink-2);min-height:17px}
.col-stats span{display:inline-flex;align-items:center;gap:5px}
.col-stats b{font-weight:600;color:var(--ink)}
.add{width:100%;text-align:left;padding:7px 10px;border:1px dashed var(--line-2);border-radius:4px;color:var(--ink-3);background:transparent;cursor:pointer;margin-bottom:4px}
.add:hover{border-color:var(--brand);color:var(--brand);background:var(--surface)}
.grp{display:flex;align-items:center;gap:7px;margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.grp .c{font-weight:400;color:var(--ink-3)}
.task{display:flex;gap:8px;padding:8px 9px 8px 7px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px;cursor:grab}
.task:hover{border-color:var(--line-2);border-left-color:var(--c)}
.task.dragging{opacity:.4}
.task.is-open{background:var(--brand-soft)}
.tst{flex:none;width:22px;height:22px;margin:-1px 0 0 -3px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.tst:hover{background:var(--surface-2)}
.tbody{min-width:0;flex:1}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.task.s-done .ttitle{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.tmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 9px;margin-top:4px;font-size:12px;color:var(--ink-2)}
.tag{padding:0 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px}
.prio{display:inline-flex;align-items:flex-end;gap:1.5px;height:11px}
.prio i{display:block;width:3px;border-radius:1px;background:var(--line-2)}
.prio i:nth-child(1){height:4px}.prio i:nth-child(2){height:7px}.prio i:nth-child(3){height:11px}
.p-high i{background:var(--crit)}
.p-med i:nth-child(-n+2){background:var(--risk)}
.p-low i:nth-child(1){background:var(--st-work)}
.cmt{display:inline-flex;align-items:center;gap:3px}

/* quick add form */
.addform{padding:10px;margin-bottom:8px;background:var(--surface);border:1px solid var(--brand);border-radius:5px}
.addform input,.addform select,.addform textarea{min-height:30px;padding:4px 8px;font-size:13px;margin-bottom:6px}
.addform details{margin:2px 0 6px}
.addform summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.addbtns{display:flex;gap:6px}

/* day view */
.dayview{height:100%;overflow:auto;padding:18px 24px 200px}
.dv-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.dv-head h2{font:600 30px/1.1 var(--fs);letter-spacing:-.02em}
.dv-head .wd{color:var(--ink-3);font-family:var(--fu);font-size:16px;font-weight:400;margin-left:8px}
.dv-list{max-width:1000px}
.dv-row{display:grid;grid-template-columns:minmax(220px,1fr) 130px 140px 34px 160px;gap:12px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px;margin-bottom:6px}
.dv-row:hover{border-color:var(--line-2);border-left-color:var(--c)}
.dv-row .ttl{cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.dv-row.s-done .ttl{color:var(--ink-3);text-decoration:line-through}
.dv-row select,.dv-row input{min-height:30px;padding:3px 8px;font-size:13px}

/* task panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .18s ease;z-index:30;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.panel.open{transform:none}
.panel-in{padding:0 24px 40px}
.panel-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:4px;padding:12px 0;background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:16px}
.crumb{font-size:13px;color:var(--ink-3)}
.p-title{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;margin:0 -6px 14px;font:600 22px/1.25 var(--fs);border-radius:5px}
.p-title:hover,.p-title:focus{border-color:var(--line-2);background:var(--surface)}
.pblock{margin-top:26px}
.pblock h3{font:600 16px var(--fs);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pblock h3 .cnt{font:400 13px var(--fu);color:var(--ink-3)}
.tagline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagline .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 8px;font-size:12.5px}
.tagline .tag button{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:0 3px;font-size:14px;line-height:1}
.tagline input{width:130px;min-height:28px;padding:2px 8px;font-size:13px}
.cm{padding:9px 0;border-bottom:1px solid var(--line)}
.cm-h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.cm-h b{color:var(--ink);font-weight:600}

/* diary */
.diary{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}

/* popover, modal, toast */
.pop{position:fixed;z-index:50;min-width:172px;padding:5px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow)}

.banner{padding:8px 24px;background:#F6E3B8;color:#5A4200;font-size:13px;border-bottom:1px solid #E1C77F}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);height:100%}
.auth-l{background:var(--side);color:var(--side-ink);padding:56px 64px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.auth-l h1{font:600 40px/1.15 var(--fs);letter-spacing:-.02em;max-width:14ch}

.auth-l .q b{display:block;font:600 20px/1.3 var(--fs)}
.auth-l .q span{color:var(--side-mute);font-size:14px}
.auth-r{display:grid;place-items:center;padding:32px;overflow:auto}
.auth-box{width:min(380px,100%)}
.auth-box h2{font:600 24px var(--fs);margin-bottom:16px}
.auth-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.auth-tabs button{padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;font-weight:600;color:var(--ink-2);margin-bottom:-1px}
.auth-tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.err{color:var(--crit);font-size:13px;margin:-4px 0 12px}
.fine{font-size:12.5px;color:var(--ink-3);margin-top:14px}

/* narrow screens: sidebar becomes a strip */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto;overflow-y:hidden}
  .side nav{display:flex;align-items:center;gap:2px}
  .brand{padding:0 10px 0 4px;white-space:nowrap}
  .nav{width:auto;white-space:nowrap}.nav-group,.side-foot{display:none}
  .page{padding:20px 16px 48px}
  .ledger{grid-template-columns:repeat(2,1fr)}
  .ledger>div{border-bottom:1px solid var(--line)}
  .tbl-wrap{overflow-x:auto}
  .diary{grid-template-columns:1fr;grid-template-rows:200px minmax(0,1fr)}
  .d-main{padding:20px 16px 60px}
  .auth{grid-template-columns:1fr}.auth-l{display:none}
  .dv-row{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== V2.1: синий акцент в духе YADRO. HEX и шрифт не подтверждены брендбуком: меняются только здесь ===== */
:root{--brand:#1448FF;--brand-2:#0B2FC4;--brand-soft:#E4EAFF;--on-brand:#FFF;--accent:#1448FF;--bg:#F7F8FB;--surface:#FFF;--surface-2:#EFF2F8;--ink:#0B1230;--ink-2:#434B63;--ink-3:#707890;--line:#DCE1EC;--line-2:#BAC2D4;--side:#0B1230;--side-2:#17224D;--side-ink:#E8ECF8;--side-mute:#8D97B8;--st-work:#0AA5B8;--fu:'Jost','Futura','Century Gothic','Segoe UI',system-ui,Arial,sans-serif;--fs:var(--fu);--mono:var(--fu)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<div id="app"></div>
<aside id="panel" class="panel" aria-label="Карточка задачи"></aside>
<div id="pop" class="pop" hidden></div>
<div id="modal-root"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   Project Tracker — план (задачи по датам) и факт (дневник проекта)
   Один файл, без сборки. Данные хранятся в localStorage браузера.
   Слои: helpers → constants → store (данные и правила) → seed →
         views (HTML-шаблоны) → events (делегирование) → boot
   ===================================================================== */

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const isWeekend = s => { const d = parse(s).getDay(); return d === 0 || d === 6; };
const fmtDM = s => { const d = parse(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const fmtDMY = s => fmtDM(s) + ' ' + parse(s).getFullYear();
const fmtShort = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '—';
const fmtTs = ts => {
  const d = new Date(ts), t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (iso(d) === today()) return 'сегодня ' + t;
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + (d.getFullYear() !== new Date().getFullYear() ? '.' + d.getFullYear() : '') + ' ' + t;
};
const fmtSize = n => n < 1024 ? n + ' Б' : Math.round(n / 1024) + ' КБ';

const ICONS = {
  x: 'M6 6l12 12M18 6L6 18', plus: 'M12 5v14M5 12h14', trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  left: 'M15 5l-7 7 7 7', right: 'M9 5l7 7-7 7', clip: 'M20 11l-8 8a5 5 0 01-7-7l8-8a3.5 3.5 0 015 5l-8 8a2 2 0 01-3-3l7-7',
  grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
  sliders: 'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4', pencil: 'M4 20h4L19 9l-4-4L4 16v4z', down: 'M6 9l6 6 6-6',
  dl: 'M12 4v11M7 11l5 5 5-5M5 20h14', chat: 'M4 5h16v11H9l-5 4z'
};
const ico = n => '<svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICONS[n] + '"/></svg>';

/* ---------- constants ---------- */
const STATUSES = [['late', 'Просрочено'], ['work', 'В работе'], ['plan', 'Запланировано'], ['done', 'Завершено']];
const ST = Object.fromEntries(STATUSES);
const DAYST = [['ok', 'Нормально'], ['risk', 'Есть риски'], ['crit', 'Критическая проблема'], ['none', 'Без изменений']];
const DAY = Object.fromEntries(DAYST);
const DAY_VAL = { ok: 0, risk: 1, crit: 2 };           // «none» в расчёт не входит
const PRIOS = [['high', 'Высокий'], ['med', 'Средний'], ['low', 'Низкий']];
const PRIO = Object.fromEntries(PRIOS);
const PRIO_W = { high: 3, med: 2, low: 1 };
const PST = [['plan', 'Запланирован'], ['work', 'В работе'], ['pause', 'На паузе'], ['done', 'Завершён']];
const PSTL = Object.fromEntries(PST);
const PSTG = { plan: 'Запланированные', work: 'В работе', pause: 'На паузе', done: 'Завершённые' };
const pst = p => p.status || 'work';
const RL = { ok: 'Нормально', risk: 'Есть риски', crit: 'Критическая проблема', none: 'Нет данных' };
const RISK_HINT = 'Средний риск рассчитывается на основе статусов дневника проекта. Дни со статусом «Без изменений» не учитываются.';
const MAX_FILE = 400 * 1024;

/* ---------- store ---------- */
const KEY = 'task-tracker-v3';
let storageOk = true;
const blankDb = () => ({ v: 1, users: [], session: null, projects: [], tasks: [], history: [], diary: [], comments: [], attachments: [], notifications: [] });
let db = loadDb();
function loadDb() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(blankDb(), o); }
  } catch (e) { storageOk = false; }
  return blankDb();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; return true; }
  catch (e) { storageOk = false; return false; }
}

const me = () => db.users.find(u => u.id === db.session) || null;
const prefs = () => { const u = me(); if (u && !u.prefs) u.prefs = { riskPeriod: '30', from: '', to: '' }; return u ? u.prefs : { riskPeriod: '30', from: '', to: '' }; };

const proj = id => db.projects.find(p => p.id === id && p.ownerId === db.session) || null;

  save(); return t;

/* Единая точка изменения задачи: пишет историю и события. Возвращает {move} при переносе. */
function updateTask(id, patch) {
  const t = taskById(id); if (!t) return {};
  const out = {};
  Object.keys(patch).forEach(k => {
    const nv = patch[k], ov = t[k];
    if (JSON.stringify(nv) === JSON.stringify(ov)) return;
    if (k === 'status') {
      if (!canSet(t, nv)) { toast(denyMsg(t, nv)); return; } t.status = nv; if (nv === 'done') t.completedAt = Date.now(); else delete t.completedAt;
      hist(id, 'status', { from: ov, to: nv });
      if (nv === 'done') note(t.projectId, 'завершена задача «' + t.title + '»', { t: 'task', id: t.id });
    } else if (k === 'date') {
      t.date = nv; out.move = hist(id, 'move', { from: ov, to: nv, reason: '' });
      if (t.status !== 'done') { const ns = statusByDate(nv, t.dur); if (ns !== t.status) { hist(id, 'status', { from: t.status, to: ns, auto: true }); t.status = ns; } t.chk = today(); }
      note(t.projectId, 'задача «' + t.title + '» перенесена на ' + fmtShort(nv), { t: 'task', id: t.id });
    } else if (k === 'assignee') { const pp = proj(t.projectId); if (pp && pp.useMembers && nv && !(pp.members || []).some(m => m.name === nv)) { toast('Выберите исполнителя из списка участников'); return; } t.assignee = nv; hist(id, 'assignee', { from: ov, to: nv }); }
    else if (k === 'priority') { t.priority = nv; hist(id, 'priority', { from: ov, to: nv }); }
    else if (k === 'title') { t.title = nv; hist(id, 'title', { from: ov, to: nv }); }
    else if (k === 'dur') { const n = Math.max(1, Math.floor(+nv) || 1); if (n === (Math.floor(+ov) || 1)) return; t.dur = n; hist(id, 'dur', { from: Math.floor(+ov) || 1, to: n }); if (t.date && t.status !== 'done') { const ns = statusByDate(t.date, n); if (ns !== t.status) { hist(id, 'status', { from: t.status, to: ns, auto: true }); t.status = ns; } } }
    else t[k] = nv;
  });
  save(); return out;
}

/* ---------- derived numbers ---------- */
function statsOf(pid) {
  const ts = tasksOf(pid), T = today();
  return { total: ts.length, today: ts.filter(t => t.date === T).length, work: ts.filter(t => t.status === 'work').length,
    late: ts.filter(t => t.status === 'late').length, done: ts.filter(t => t.status === 'done').length, plan: ts.filter(t => t.status === 'plan').length };
}
function periodInfo() {
  const pr = prefs(), T = today(), MIN = '0000-00-00', MAX = '9999-12-31';
  if (pr.riskPeriod === '7') return { from: addDays(T, -6), to: T, label: 'последние 7 дней' };
  if (pr.riskPeriod === 'month') { const d = parse(T); return { from: iso(new Date(d.getFullYear(), d.getMonth(), 1)), to: T, label: 'текущий месяц' }; }
  if (pr.riskPeriod === 'all') return { from: MIN, to: MAX, label: 'весь проект' };
  if (pr.riskPeriod === 'custom') {
    const f = pr.from || MIN, t = pr.to || MAX;
    return { from: f, to: t, label: 'период ' + (pr.from ? fmtShort(pr.from) : '…') + '–' + (pr.to ? fmtShort(pr.to) : '…') };
  }
  return { from: addDays(T, -29), to: T, label: 'последние 30 дней' };
}
/* Возвращает 'ok' | 'risk' | 'crit' | 'none'. Число наружу не отдаётся. */
function riskLevel(pid) {
  const per = periodInfo();
  const vals = diaryOf(pid).filter(e => e.date >= per.from && e.date <= per.to && e.dayStatus !== 'none').map(e => DAY_VAL[e.dayStatus]);
  if (!vals.length) return 'none';
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return avg < 0.5 ? 'ok' : avg < 1.2 ? 'risk' : 'crit';
}
function projectDayStatus(pid) {
  const l = diaryOf(pid).filter(e => e.dayStatus !== 'none');
  return l.length ? l[l.length - 1].dayStatus : null;
}

/* ---------- auth (локальный профиль, только для этого браузера) ---------- */
async function sha(str) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return 'x' + h; }
}
async function register(name, email, pw) {
  email = email.trim().toLowerCase();
  if (!name.trim()) return 'Укажите имя';
  if (!/^\S+@\S+\.\S+$/.test(email)) return 'Проверьте адрес почты';
  if (pw.length < 6) return 'Пароль — не короче 6 символов';
  if (db.users.some(u => u.email === email)) return 'Такой аккаунт уже есть — войдите';
  const salt = uid();
  const u = { id: uid(), name: name.trim(), email, salt, hash: await sha(salt + pw), prefs: { riskPeriod: '30', from: '', to: '' } };
  db.users.push(u); db.session = u.id; save(); return '';
}
async function login(email, pw) {
  email = email.trim().toLowerCase();
  const u = db.users.find(x => x.email === email);
  if (!u || u.hash !== await sha(u.salt + pw)) return 'Неверная почта или пароль';
  db.session = u.id; save(); return '';
}
async function demoLogin() {
  let u = db.users.find(x => x.email === 'demo@tracker.local');
  if (!u) {
    const salt = uid();
    u = { id: uid(), name: 'Демо-пользователь', email: 'demo@tracker.local', salt, hash: await sha(salt + 'demo'), prefs: { riskPeriod: '30', from: '', to: '' } };
    db.users.push(u); seedDemo(u.id);
  }
  db.session = u.id; save();
}

/* ---------- files ---------- */
async function saveFile(name, data) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) { const b = data instanceof Blob ? data : new Blob([data]), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Файл сохранён'); return; }
    await dl.save({ filename: name, data }); toast('Файл сохранён');
  } catch (err) { if (err && err.code === 'declined') return; toast(err && err.code === 'rejected_extension' ? 'Файлы такого формата нельзя скачать отсюда' : 'Не удалось сохранить файл'); }
}
function dataUrlToBlob(u) {
  const m = /^data:([^;,]*)(;base64)?,(.*)$/.exec(u); if (!m) return new Blob([]);
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: m[1] });
}
function exportData() {
  const ps = myProjects(), pids = new Set(ps.map(p => p.id)), ts = myTasks(), tids = new Set(ts.map(t => t.id));
  const ds = db.diary.filter(e => pids.has(e.projectId)), eids = new Set(ds.map(e => e.id));
  saveFile('project-tracker-backup.json', JSON.stringify({ app: 'project-tracker', version: 1, exportedAt: new Date().toISOString(), projects: ps, tasks: ts,
    history: db.history.filter(h => tids.has(h.taskId)), diary: ds, comments: db.comments.filter(c => tids.has(c.taskId)),
    attachments: db.attachments.filter(a => tids.has(a.ownerId) || eids.has(a.ownerId)), notifications: db.notifications.filter(n => pids.has(n.projectId)) }, null, 2));
}
function handleImport(el) {
  const file = el.files && el.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result); if (!o || o.app !== 'project-tracker' || !Array.isArray(o.projects)) throw new Error('bad');
      const have = (arr, x) => arr.some(y => y.id === x.id); let n = 0;
      o.projects.forEach(p => { if (!have(db.projects, p)) { p.ownerId = db.session; db.projects.push(p); n++; } });
      ['tasks', 'history', 'diary', 'comments', 'attachments', 'notifications'].forEach(k => (o[k] || []).forEach(x => { if (!have(db[k], x)) db[k].push(x); }));
      save(); render(); toast('Импортировано проектов: ' + n);
    } catch (e) { toast('Не удалось прочитать файл. Нужен экспорт из Project Tracker.'); }
  };
  rd.readAsText(file); el.value = '';
}
function handleAttach(el) {
  const files = Array.from(el.files || []), ot = el.dataset.otype, oid = el.dataset.oid; el.value = '';
  if (ot === 'diary') captureDraft();
  let pending = files.length; if (!pending) return;
  function done() { if (--pending === 0) { if (ot === 'task') { refreshPanel(); render(); } else render(); } }
  files.forEach(f => {
    if (f.size > MAX_FILE) { toast('Файл «' + f.name + '» больше 400 КБ, вложение не добавлено'); done(); return; }
    const rd = new FileReader();
    rd.onload = () => { db.attachments.push({ id: uid(), ownerType: ot, ownerId: oid, name: f.name, size: f.size, type: f.type, data: rd.result, at: Date.now() }); if (!save()) { db.attachments.pop(); toast('В браузере не хватило места, вложение не добавлено'); } done(); };

}
